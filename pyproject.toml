[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "errcode-atlas"
version = "0.1.0"
description = "三平台错误码与退出码判定表：给定「数字 + 平台 + 语境」，判它能否被唯一归因"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yuluo554" }]
keywords = ["errno", "exit-code", "signals", "posix", "error-code", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Debuggers",
  "Typing :: Typed",
]
# 运行期零第三方依赖：判定层只用标准库，编目随包分发为冻结 JSON。
dependencies = []

[project.optional-dependencies]
# 仅在生成侧（tools/build_catalog.py）需要 YAML 解析器。
dev = ["pytest>=7.4", "PyYAML>=6.0"]

[project.scripts]
errcode-atlas = "errcode_atlas.cli:main"

[project.urls]
Homepage = "https://github.com/yuluo554/errcode-atlas"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
errcode_atlas = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"