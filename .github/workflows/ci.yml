name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# job 级 env 一次写全（不是按 step 零散加）：step 漏一行就是同一个红。
# 三条配置面坑（plan/02 §4.3、plan/05 §4 U2/U4）：
#   PYTHONPATH  —— src 布局，不装包时只有它能撑住 import
#   PYTHONUTF8 / PYTHONIOENCODING —— 门的输出是中文，windows runner 默认代码页编不了
#
# **首推实跑记录**（M6）：见 `plan/RELEASE-M6.md` §二。首推当场抓到两处**只在 CI 才红**
# 的作业设计缺陷（本机系统 Python 恰好装着 PyYAML，把两处都掩盖了）：
#   1. layout job 从未装 dev 依赖，却要跑 `build_catalog.py --check` → 已补"安装生成侧依赖"步；
#   2. offline job 让"故意不装包"的镜像去跑那个 dev 侧脚本 → 已改为只跑运行期路径。
# 这两处不是代码缺陷，是**作业边界**错位；修法留在本文件的注释里，免得下次又塞回去。

env:
  PYTHONPATH: src
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  layout:
    name: layout (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 生成器冻结态那一步要 PyYAML（`tools/build_catalog.py` 是 dev 侧工具，`plan/02` D2）。
      # **首推实测**：不装它，bootstrap 过的 CI 镜像里没有这个包，那一步直接 `缺少 PyYAML` 红
      # （rc=3）—— 而本机系统 Python 恰好装着，所以本地永远看不到。只装 dev extra 的
      # **生成侧**依赖，不装项目本身（这一步验的是"树里冻结件与源一致"，不是"包能装"）。
      - name: 安装生成侧依赖
        run: python -m pip install --disable-pip-version-check "PyYAML>=6.0"
      - name: 布局门
        run: python tools/check_sprint_layout.py
      - name: 脱敏门
        run: python tools/check_desensitized.py
      - name: 门的变异验证
        run: python tools/verify_gates.py
      - name: 发布门（pre-tag 档）
        # 只跑 pre-tag。另两档要 tag 与远端事实，放在**每次** push 上会在打 tag 之前恒红 ——
        # 那不是缺陷信号，是档位选错了。发布收尾由人工跑 `--offline` / `--online`。
        run: python tools/check_release.py --pre-tag
      - name: 生成器冻结态
        run: python tools/build_catalog.py --check

  test:
    name: test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装 dev extra
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: 零第三方依赖（差集式）
        run: |
          python -S -c "import sys; sys.path.insert(0,'src'); import errcode_atlas.cli; extra=sorted({m.split('.')[0] for m in sys.modules} - sys.stdlib_module_names - {'errcode_atlas','__main__'}); print(extra); assert extra == []"
      - name: pytest
        run: python -m pytest -q
      - name: CLI 冒烟（显式断言退出码，不靠 shell 吞非零）
        shell: bash
        run: |
          set -u
          python -m errcode_atlas --version
          python -m errcode_atlas build --check

          # `explain 99999` 的**正确**退出码是 3（算不了），不是 0。
          # 若直接让它跑在 `set -e` 下，这一步会"红得没有断言输出" —— 看起来像逻辑坏了，
          # 实际是冒烟步把"正确的非零"当成了失败（既有纪律：冒烟步必须有断言输出）。
          set +e
          out=$(python -m errcode_atlas explain 99999 --platform linux --json)
          rc=$?
          set -e
          echo "exit=$rc"
          echo "$out" | python -c "import json,sys; d=json.load(sys.stdin); assert d['verdict']=='UNKNOWN', d"
          test "$rc" -eq 3

  offline:
    name: offline (network none)
    runs-on: ubuntu-latest
    # **没有 `container:` 块** —— Actions 的 job 容器模型与 `--network none` 互斥
    # （docker: conflicting options: cannot attach both user-defined and non-user-defined
    # network-modes）。正解 = 普通 runner + 嵌套 `docker run --network none`。
    steps:
      - uses: actions/checkout@v4
      - name: 构建离线镜像（构建期可联网，运行期完全无网络）
        run: docker build -f .github/offline.Dockerfile -t errcode-atlas-offline .
      - name: 无网络跑门与 CLI
        # **本 job 的入选判据 = "这条命令只走运行期路径吗？"** 两条都得满足：
        #   (a) 不需要第三方包（镜像按纪律不 pip install，见 `.github/offline.Dockerfile` 第 1 条）；
        #   (b) 不读 **git 元数据**（`python:3.12-slim` 里没有 git 二进制）。
        #
        # 首推 + 二推各撞了一次同一族缺陷，逐条记下来免得第三次：
        #   · 一推：这里跑了生成器冻结态校验 —— 那是 dev 侧工具、要 PyYAML，(a) 不满足。
        #   · 二推：改为跑发布门 —— 它要 `git ls-tree` / `git cat-file` 读 tag 树，(b) 不满足
        #     （报 `FileNotFoundError: 'git'`）。**发布门属 layout job，不属本 job。**
        # 现在这两条都留在 layout job；本 job 只放"两条都满足"的命令：
        # 两道门（`LAYOUT.*` 明写"判据只落仓库内文件，不读 git 元数据"）+ 运行期 CLI。
        run: |
          docker run --rm --network none errcode-atlas-offline python tools/check_sprint_layout.py
          docker run --rm --network none errcode-atlas-offline python tools/check_desensitized.py
          docker run --rm --network none errcode-atlas-offline python -m errcode_atlas build --check
          docker run --rm --network none errcode-atlas-offline python -m errcode_atlas selftest
          docker run --rm --network none errcode-atlas-offline python -m errcode_atlas --version